<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 376" role="img" aria-labelledby="nd-title">
  <title id="nd-title">Noel D'Costa monogram</title>
  <defs>
    <linearGradient id="nd-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B0B"/>
      <stop offset="0.48" stop-color="#0B0B0B"/>
      <stop offset="0.74" stop-color="#7A3F0C"/>
      <stop offset="1" stop-color="#FFA23A"/>
    </linearGradient>
    <linearGradient id="nd-dstem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CF8E"/>
      <stop offset="0.55" stop-color="#B9844E"/>
      <stop offset="1" stop-color="#4A2E18"/>
    </linearGradient>
    <linearGradient id="nd-bowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A1F"/>
      <stop offset="0.55" stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#D9620A"/>
    </linearGradient>
  </defs>
  <!-- N diagonal -->
  <path d="M0 0 L335 301.5 L335 376 L328 376 L0 80 Z" fill="#0B0B0B"/>
  <!-- N stem -->
  <path d="M0 0 H60 V316 L0 376 Z" fill="url(#nd-stem)"/>
  <!-- D stem, cut parallel to the diagonal -->
  <path d="M275 0 H330 V279 L275 229.5 Z" fill="url(#nd-dstem)"/>
  <!-- D bowl -->
  <path fill="url(#nd-bowl)" fill-rule="evenodd" d="M330 0 H428 A188 188 0 0 1 428 376 H330 Z M330 60 H428 A128 128 0 0 1 428 316 H330 Z"/>
</svg>
