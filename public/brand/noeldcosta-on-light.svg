<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="600" height="130" role="img" aria-label="noeldcosta">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;display=swap');
      .nd-wordmark {
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 92px;
        letter-spacing: -0.04em;
        fill: #0e1020;
      }
      .nd-sparkle { fill: #fc985a; }
    </style>
  </defs>

  <!-- Wordmark -->
  <text x="18" y="98" class="nd-wordmark">noeldcosta</text>

  <!-- Big sparkle above the L ascender -->
  <g transform="translate(174, 8)" class="nd-sparkle">
    <path d="M 14 0
             C 14 8, 8 14, 0 14
             C 8 14, 14 20, 14 28
             C 14 20, 20 14, 28 14
             C 20 14, 14 8, 14 0 Z"/>
  </g>

  <!-- Smaller sparkle, offset to the right -->
  <g transform="translate(206, 22)" class="nd-sparkle">
    <path d="M 8 0
             C 8 4.5, 4.5 8, 0 8
             C 4.5 8, 8 11.5, 8 16
             C 8 11.5, 11.5 8, 16 8
             C 11.5 8, 8 4.5, 8 0 Z"/>
  </g>
</svg>
